name: Deploy Vite app to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Inspect build output
        run: |
          echo "=== dist listing ==="
          ls -la dist || true
          echo "=== dist/index.html (first 200 lines) ==="
          sed -n '1,200p' dist/index.html || true

      - name: Validate built index.html
        run: |
          if [ -f dist/index.html ]; then
            if grep -q '/src/main.tsx' dist/index.html; then
              echo "ERROR: dist/index.html references /src/main.tsx (dev index). Aborting deployment." >&2
              exit 1
            fi
          else
            echo "ERROR: dist/index.html not found" >&2
            exit 1
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
